      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: secret
        namespace: infisical

      secretsScope:
        projectId: 14e34fd2-419e-4762-bb88-97561501e19b
        envSlug: prod
        secretsPath: /
  managedKubeSecretReferences:
    - secretName: secrets
      secretNamespace: sentry
