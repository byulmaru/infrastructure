apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: actions-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infrastructure
  sources:
    - repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
      chart: gha-runner-scale-set
      targetRevision: 0.14.1
      helm:
        valuesObject:
          githubConfigUrl: https://github.com/byulmaru
          githubConfigSecret: arc-github-app
          runnerScaleSetName: byulmaru-arc
          minRunners: 0
          maxRunners: 2
          controllerServiceAccount:
            namespace: arc-systems
            name: actions-runner-controller-gha-rs-controller
          listenerTemplate:
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 1
                      preference:
                        matchExpressions:
                          - key: oci.oraclecloud.com/oke-is-preemptible
                            operator: Exists
                            values: []
              tolerations:
                - key: oci.oraclecloud.com/oke-is-preemptible
                  operator: Equal
                  value: present
                  effect: NoSchedule
              containers:
                - name: listener
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
          template:
            spec:
              affinity:
                nodeAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 1
                      preference:
                        matchExpressions:
                          - key: oci.oraclecloud.com/oke-is-preemptible
                            operator: Exists
                            values: []
              tolerations:
                - key: oci.oraclecloud.com/oke-is-preemptible
                  operator: Equal
                  value: present
                  effect: NoSchedule
              initContainers:
                - name: init-dind-externals
                  image: ghcr.io/actions/actions-runner:latest
                  command:
                    - cp
                  args:
                    - -r
                    - /home/runner/externals/.
                    - /home/runner/tmpDir/
                  volumeMounts:
                    - name: dind-externals
                      mountPath: /home/runner/tmpDir
                - name: dind
                  image: docker:dind
                  args:
                    - dockerd
                    - --host=unix:///var/run/docker.sock
                    - --group=$(DOCKER_GROUP_GID)
                  env:
                    - name: DOCKER_GROUP_GID
                      value: "123"
                  securityContext:
                    privileged: true
                  restartPolicy: Always
                  startupProbe:
                    exec:
                      command:
                        - docker
                        - info
                    initialDelaySeconds: 0
                    failureThreshold: 24
                    periodSeconds: 5
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run
                    - name: dind-externals
                      mountPath: /home/runner/externals
                    - name: dind-storage
                      mountPath: /var/lib/docker
              containers:
                - name: runner
                  image: ghcr.io/actions/actions-runner:latest
                  command:
                    - /home/runner/run.sh
                  env:
                    - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
                      value: "false"
                    - name: DOCKER_HOST
                      value: unix:///var/run/docker.sock
                    - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                      value: "120"
                  resources:
                    requests:
                      cpu: "1"
                      memory: 4Gi
                    limits:
                      cpu: "2"
                      memory: 4Gi
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: dind-sock
                      mountPath: /var/run
              volumes:
                - name: work
                  emptyDir: {}
                - name: dind-sock
                  emptyDir: {}
                - name: dind-externals
                  emptyDir: {}
                - name: dind-storage
                  emptyDir: {}
    - repoURL: https://github.com/byulmaru/infrastructure.git
      targetRevision: HEAD
      path: actions-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      enabled: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
