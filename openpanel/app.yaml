apiVersion: v1
kind: Service
metadata:
  name: op-api
  labels:
    app: op-api
    component: api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: op-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: op-api
  labels:
    app: op-api
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: op-api
  template:
    metadata:
      labels:
        app: op-api
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: oci.oraclecloud.com/oke-is-preemptible
                    operator: Exists
                    values: []
      tolerations:
        - key: oci.oraclecloud.com/oke-is-preemptible
          operator: Equal
          value: present
          effect: NoSchedule
      initContainers:
        - name: wait-for-databases
          image: docker.io/library/busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z op-kv 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              until nc -z main-clickhouse-headless 8123; do
                echo "Waiting for ClickHouse..."
                sleep 2
              done
              until wget -q -O- http://main-clickhouse-headless:8123/ping; do
                echo "Waiting for ClickHouse HTTP..."
                sleep 2
              done
              echo "All databases are ready!"
      containers:
        - name: api
          image: docker.io/lindesvard/openpanel-api:latest
          ports:
            - containerPort: 3000
              name: http
          command:
            - sh
            - -c
            - |
              echo 'Running migrations...'
              CI=true pnpm -r run migrate:deploy
              pnpm start
          env:
            - name: NODE_ENV
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: NODE_ENV
            - name: SELF_HOSTED
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: SELF_HOSTED
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: DATABASE_URL
            - name: DATABASE_URL_DIRECT
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: DATABASE_URL_DIRECT
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: REDIS_URL
            - name: CLICKHOUSE_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: CLICKHOUSE_URL
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: API_URL
            - name: DASHBOARD_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: DASHBOARD_URL
            - name: NEXT_PUBLIC_DASHBOARD_URL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: DASHBOARD_URL
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: COOKIE_SECRET
            - name: ALLOW_REGISTRATION
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: ALLOW_REGISTRATION
            - name: ALLOW_INVITATION
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: ALLOW_INVITATION
            - name: API_PORT
              value: "3000"
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: EMAIL_SENDER
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: EMAIL_SENDER
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: AI_MODEL
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: AI_MODEL
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: secrets
                  key: GOOGLE_REDIRECT_URI
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 3000
            initialDelaySeconds: 180
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
---
