apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildx-runner
  namespace: arc-runners
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkit
  namespace: arc-runners
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: buildx-runner
  namespace: arc-runners
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/attach
      - pods/exec
      - pods/log
      - services
      - configmaps
      - secrets
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: buildx-runner
  namespace: arc-runners
subjects:
  - kind: ServiceAccount
    name: buildx-runner
    namespace: arc-runners
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: buildx-runner
