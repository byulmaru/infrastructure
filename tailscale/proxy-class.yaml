apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: kube-apiserver
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        image: docker.io/tailscale/k8s-proxy:latest
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tailscale-default
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        resources:
          requests:
            memory: 32Mi
